<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Registration Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="layout">
  <aside class="intro">
    <h1>Student Registration Portal</h1>
    <p>It takes about 3 minutes. You will get a registration number instantly.</p>
    <ul>
      <li>Keep your phone number and emergency contact ready</li>
      <li>Use an email address you check regularly</li>
      <li>Each email can register only once</li>
    </ul>
  </aside>

  <section class="panel">
    <form id="regForm">
      <input type="text" name="fullName" placeholder="Full Name *" required pattern="[A-Za-z ]{3,50}" title="Min 3 letters">
      <input type="email" name="email" placeholder="Email *" required>
      <input type="tel" name="phone" placeholder="Phone (10 digits) *" required pattern="[0-9]{10}" title="Enter 10 digit number">
      <input type="date" name="dob" required>
      <select name="gender" required>
        <option value="">Select Gender</option>
        <option>Male</option><option>Female</option><option>Other</option>
      </select>
      <input type="text" name="city" placeholder="City *" required>
      <input type="text" name="state" placeholder="State *" required>
      <select name="course" required>
        <option value="">Select Course</option>
        <option>BCA</option><option>MCA</option><option>B.Tech</option><option>MBA</option>
      </select>
      <select name="qualification" required>
        <option value="">Qualification</option>
        <option>12th</option><option>Graduation</option><option>Post Graduation</option>
      </select>
      <button type="submit">Submit Registration</button>
    </form>
    <p id="msg"></p>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
