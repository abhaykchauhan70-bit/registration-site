<script>
let allData = [];
let ADMIN_KEY = localStorage.getItem('adminKey');

async function loadData(){
  if(!ADMIN_KEY){
    ADMIN_KEY = prompt("Enter Admin Key:");
    if(!ADMIN_KEY) return;
    localStorage.setItem('adminKey', ADMIN_KEY);
  }
  try{
    const res = await fetch(`/api/registrations?key=${ADMIN_KEY}`);
    if(res.status === 401){
      alert("Wrong Key! Try again");
      localStorage.removeItem('adminKey');
      ADMIN_KEY = null;
      return loadData();
    }
    const data = await res.json();
    allData = data;
    renderTable(allData);
  }catch(e){
    document.getElementById('tbody').innerHTML = `<tr><td colspan="11">Error: ${e.message}</td></tr>`;
  }
}
// ... baaki tera same renderTable, filterData, exportCSV
</script>
